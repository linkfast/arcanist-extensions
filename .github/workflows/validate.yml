name: Validate

# Every change to the catalog (and every pull request proposing one) is checked: its format, and that each
# release is the package it says it is (SHA-256, size, id and version).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py --download
