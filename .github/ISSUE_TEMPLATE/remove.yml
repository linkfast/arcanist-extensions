name: Remove an extension or a version
description: Withdraw a version (a broken one) or a whole extension you maintain.
title: "Remove an extension or a version"
labels: ["submission", "submission:remove"]
body:
  - type: markdown
    attributes:
      value: |
        Servers stop offering what is removed; installed copies keep working. Requests from one of the extension's
        maintainers are applied right away; others open a pull request for review (to report a harmful extension,
        say why below).
  - type: input
    id: extension
    attributes:
      label: Extension id
      placeholder: my-extension
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Empty removes the whole extension.
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: Reason
    validations:
      required: true
