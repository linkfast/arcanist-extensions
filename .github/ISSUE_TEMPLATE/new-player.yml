name: Add a web player
description: Propose a new web player for Arcanist's marketplace.
title: "Add a web player"
labels: ["submission", "submission:new"]
body:
  - type: markdown
    attributes:
      value: |
        Open source, free, freemium or paid: all can be listed. A web player runs on the server's address with its
        users' sessions, so a new one is **reviewed by the catalog's maintainers** before it is listed. When you
        submit this form, an automation downloads your package, checks it, and opens a pull request with the entry;
        you can edit this issue to fix anything it reports, and it runs again.

        The player's id, name, version and license come from the `arcanist-frontend.json` in your package (see
        [docs/developers/frontends.md](https://github.com/linkfast/arcanist/blob/main/docs/developers/frontends.md)).
        You become its maintainer: you then publish versions and change its entry yourself with the same forms as
        extensions (**Publish a version**, **Change an extension's entry**, **Remove**), with no review.
  - type: input
    id: package
    attributes:
      label: Package URL
      description: >-
        The player's `.zip`, attached to a release of its public GitHub repository, such as
        `https://github.com/<owner>/<repo>/releases/download/v1.0.0/my-player-1.0.0.zip`.
      placeholder: https://github.com/owner/repo/releases/download/v1.0.0/my-player-1.0.0.zip
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing
      description: >-
        How it is offered. Paid and freemium players sell themselves: the purchase is yours to handle, in the
        player or on your site; the marketplace only shows the model and a link to your prices.
      options:
        - Open source
        - Free
        - Freemium
        - Paid
    validations:
      required: true
  - type: input
    id: pricing-page
    attributes:
      label: Pricing page
      description: Optional, an https page with its prices or where to buy it.
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: One or two sentences in English. Empty uses the description in its manifest.
    validations:
      required: false
  - type: input
    id: name-es
    attributes:
      label: Name in Spanish
      description: Optional.
    validations:
      required: false
  - type: textarea
    id: description-es
    attributes:
      label: Description in Spanish
      description: Optional.
    validations:
      required: false
  - type: input
    id: icon
    attributes:
      label: Icon URL
      description: Optional. A square `.svg`, `.png` or `.webp` of up to 256 KB, over https (it is copied into this repository).
    validations:
      required: false
  - type: input
    id: categories
    attributes:
      label: Categories
      description: Optional, separated by commas (up to 5), such as `import, lyrics`.
    validations:
      required: false
  - type: input
    id: min-server
    attributes:
      label: Oldest Arcanist version it runs on
      description: Optional, such as `0.1.0-alpha.2`. Servers older than this do not see this version.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      options:
        - label: If it is open source, the package is built from the public source in that repository.
          required: true
        - label: Its license lets Arcanist's users run it alongside an AGPL-3.0 server (see the README).
          required: true
        - label: It does not collect or send its users' data (nor their sessions) without telling them in its description.
          required: true
